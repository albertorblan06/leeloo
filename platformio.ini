; Leeloo firmware and host-side tests. See docs/ROADMAP.md (Phase 0).

[platformio]
default_envs = native
; LittleFS image content: the gzip web app from `npm run build` in web/.
data_dir = web/dist

; Host-side unit tests for hardware-free logic in lib/. Runs on the dev machine.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
; src/ holds Arduino code and must not be built for the host.
build_src_filter = -<*>

; PROVISIONAL: board taken from the Amazon listing ("ESP32-S3-WROOM-1-N16R8
; DevKitC-1"), NOT verified on hardware. Flash size, PSRAM, partition table
; and Arduino core version are intentionally unset until the Phase 1 gate.
[env:esp32s3]
platform = platformio/espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
; N16R8 = 16 MB QIO flash + 8 MB octal PSRAM. The stock devkitc-1 board is the
; N8 (no PSRAM), so both are set here; reading loads books into PSRAM.
board_build.arduino.memory_type = qio_opi
build_flags = -std=gnu++17 -Wall -Wextra -DBOARD_HAS_PSRAM
build_unflags = -std=gnu++11
monitor_speed = 115200
board_build.filesystem = littlefs
; 16 MB flash: LittleFS gets ~6 MiB (see partitions.csv). Provisional until the board is verified.
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; OLED driver (SH1106/SSD1306 with Latin-1 fonts). Not in env:native: pure
; logic in lib/ must stay hardware-free.
lib_deps = olikraus/U8g2@2.36.18
