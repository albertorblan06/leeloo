; Leeloo firmware and host-side tests. See docs/ROADMAP.md (Phase 0).

[platformio]
default_envs = native

; Host-side unit tests for hardware-free logic in lib/. Runs on the dev machine.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
; src/ holds Arduino code and must not be built for the host.
build_src_filter = -<*>

; PROVISIONAL: board taken from the Amazon listing ("ESP32-S3-WROOM-1-N16R8
; DevKitC-1"), NOT verified on hardware. Flash size, PSRAM, partition table
; and Arduino core version are intentionally unset until the Phase 1 gate.
[env:esp32s3]
platform = platformio/espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11
